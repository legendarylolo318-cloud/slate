[package]
name = "sone"
version.workspace = true
description = "Native Slint TIDAL client (port of lullabyX/sone)"
authors.workspace = true
license.workspace = true
edition.workspace = true
build = "build.rs"

[features]
default = ["renderer-skia-vulkan", "renderer-femtovg", "renderer-software"]
renderer-skia = ["slint/renderer-skia"]
renderer-skia-vulkan = ["renderer-skia", "slint/renderer-skia-vulkan"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]

[dependencies]
sone-core = { path = "../sone-core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "accessibility"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
anyhow = "1"
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"

[target.'cfg(target_os = "linux")'.dependencies]
mpris-server = "0.9"
ksni = "0.3"

[build-dependencies]
slint-build = "1.18"
