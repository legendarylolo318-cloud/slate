[package]
name = "slate-core"
version.workspace = true
description = "Frontend-agnostic core of Slate: TIDAL client, playback engine, scrobbling, servers"
authors.workspace = true
license.workspace = true
edition.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1.0.28"
gstreamer = "0.23"
gstreamer-app = "0.23"
crossbeam-channel = "0.5"
walkdir = "2"
id3 = "1"
reqwest = { version = "0.11", features = ["json", "socks"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.21"
dirs = "5"
rand = "0.10.1"
sha2 = "0.10.9"
md5 = "0.7"
async-trait = "0.1"
log = "0.4"
notify = "8.2"
notify-debouncer-full = "0.7"
thiserror = "2"
aes-gcm = "0.10"
keyring = { version = "3", features = ["sync-secret-service"] }
zeroize = "1"
discord-rich-presence = "1.1"
zbus = "5"
rmcp = { version = "2.1.0", features = ["server", "transport-streamable-http-server", "macros"] }
schemars = "1"
axum = "0.7"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "linux")'.dependencies]
alsa = "0.10"
libc = "0.2"
x11rb = { version = "0.13.2", features = ["screensaver", "dpms"] }
wayland-client = { version = "0.31", features = ["dlopen"] }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }

[dev-dependencies]
tempfile = "3"
proptest = "1"
wiremock = "0.6"
