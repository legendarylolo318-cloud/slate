[package]
name = "slate"
version.workspace = true
description = "Native Slint TIDAL client (port of lullabyX/sone)"
authors.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true
build = "build.rs"

[features]
default = ["renderer-skia-vulkan", "renderer-femtovg", "renderer-software"]
renderer-skia = ["slint/renderer-skia"]
# Skia's Vulkan path is switched on for Linux only (target section below).
# Windows uses Skia's Direct3D path, and rust-skia publishes no prebuilt
# Windows binary with both D3D and Vulkan, which would force a source build.
renderer-skia-vulkan = ["renderer-skia"]
renderer-femtovg = ["slint/renderer-femtovg"]
renderer-software = ["slint/renderer-software"]

[dependencies]
slate-core = { path = "../slate-core" }
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "accessibility", "unstable-winit-030"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter", "tracing-log"] }
anyhow = "1"
gstreamer = "0.23"
gstreamer-app = "0.23"
serde = { version = "1", features = ["derive"] }
futures-util = "0.3"
lru = "0.19"
serde_json = "1"
qrcode = { version = "0.14", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
open = "5"
base64 = "0.22"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
interprocess = "2"
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["renderer-skia-vulkan"] }
# Probe for a usable Vulkan driver before choosing Skia/Vulkan (same version Skia uses).
ash = "0.38"
mpris-server = "0.9"
ksni = "0.3"
dirs = "5"
# XDG GlobalShortcuts portal (platform/global_keys.rs); already in the tree via rfd.
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }

[build-dependencies]
slint-build = "1.18"

[target.'cfg(windows)'.dependencies]
# DXGI adapter probe before choosing a GPU renderer (bootstrap.rs).
# Single-instance pipe: owner check (ipc.rs).
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Security", "Win32_System_Threading"] }
widestring = "1"
tray-icon = { version = "0.26", default-features = false }
souvlaki = { version = "0.9", default-features = false }
global-hotkey = "0.9"
raw-window-handle = "0.6"
slint = { version = "1.18", default-features = false, features = ["raw-window-handle-06"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"
