name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:   # build artifacts without publishing

env:
  GST_VERSION: "1.24.13"

jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" >> $GITHUB_ENV
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang libfuse2 file \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            gstreamer1.0-libav gstreamer1.0-alsa gstreamer1.0-pulseaudio gstreamer1.0-pipewire \
            libasound2-dev libdbus-1-dev libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libvulkan-dev \
            libsoup-3.0-0 glib-networking
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p slate
      - name: Fetch linuxdeploy
        run: |
          curl -fsSL -o linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl -fsSL -o linuxdeploy-plugin-gstreamer.sh https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gstreamer/master/linuxdeploy-plugin-gstreamer.sh
          chmod +x linuxdeploy linuxdeploy-plugin-gstreamer.sh
      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          DEPLOY_GTK_VERSION: ""
        run: |
          install -Dm644 assets/icons/128x128.png AppDir/usr/share/icons/hicolor/128x128/apps/slate.png
          install -Dm644 data/io.github.legendarylolo318_cloud.slate.metainfo.xml AppDir/usr/share/metainfo/io.github.legendarylolo318_cloud.slate.metainfo.xml
          install -Dm755 packaging/appimage/gst-registry-hook.sh AppDir/apprun-hooks/gst-registry-hook.sh
          # Loaded at runtime, so linuxdeploy cannot see them: libsoup (dlopened by
          # gstsoup) and GIO's TLS module (HTTPS for souphttpsrc).
          install -Dm644 /usr/lib/x86_64-linux-gnu/gio/modules/libgiognutls.so AppDir/usr/lib/gio/modules/libgiognutls.so
          # Host GPU stack stays on the host; never bundle it.
          printf '%s\n' libvulkan.so.1 libGL.so.1 libEGL.so.1 libGLX.so.0 libGLdispatch.so.0 libdrm.so.2 libgbm.so.1 > excludelist.txt
          export EXTRA_PLATFORM_PLUGINS=""
          for l in $(cat excludelist.txt); do export LINUXDEPLOY_EXCLUDE="$LINUXDEPLOY_EXCLUDE $l"; done
          ./linuxdeploy --appdir AppDir --plugin gstreamer \
            --executable target/release/slate \
            --library /usr/lib/x86_64-linux-gnu/libsoup-3.0.so.0 \
            --deploy-deps-only AppDir/usr/lib/gio/modules \
            --desktop-file data/io.github.legendarylolo318_cloud.slate.desktop \
            --icon-file assets/icons/128x128.png --icon-filename slate \
            --exclude-library 'libvulkan*' --exclude-library 'libGL.so*' --exclude-library 'libEGL*' \
            --exclude-library 'libGLX*' --exclude-library 'libGLdispatch*' --exclude-library 'libdrm*' --exclude-library 'libgbm*' \
            --output appimage
          mkdir -p dist
          mv Slate*.AppImage "dist/slate-$VERSION-x86_64.AppImage" 2>/dev/null || mv *.AppImage "dist/slate-$VERSION-x86_64.AppImage"
      - name: Check no GPU libs were bundled, MimeType present
        run: |
          chmod +x dist/*.AppImage
          dist/*.AppImage --appimage-extract >/dev/null
          ! find squashfs-root \( -name 'libvulkan*' -o -name 'libEGL*' -o -name 'libGL.so*' -o -name 'libGLX*' \) | grep .
          grep -q '^MimeType=.*x-scheme-handler/tidal' squashfs-root/*.desktop
      - name: Self-test AppImage (bundled GStreamer plugins, HTTPS)
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          # Only what the bundle carries: hide the runner's GStreamer plugins,
          # GIO modules and libsoup.
          L=/usr/lib/x86_64-linux-gnu
          sudo mv $L/gstreamer-1.0 $L/gstreamer-1.0.hidden
          sudo mv $L/gio/modules $L/gio/modules.hidden
          for f in $L/libsoup-3.0.so* $L/libsoup-2.4.so*; do [ -e "$f" ] && sudo mv "$f" "$f.hidden"; done
          dist/slate-$VERSION-x86_64.AppImage --self-test --network
          # Fedora layout: CA bundle only at /etc/pki/tls/certs/ca-bundle.crt.
          sudo mkdir -p /etc/pki/tls/certs
          sudo cp -L /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt
          sudo mv /etc/ssl/certs/ca-certificates.crt /etc/ssl/certs/ca-certificates.crt.hidden
          dist/slate-$VERSION-x86_64.AppImage --self-test --network
      - uses: actions/upload-artifact@v4
        with: { name: appimage, path: dist/*.AppImage }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version
        shell: pwsh
        run: |
          $v = (Select-String -Path Cargo.toml -Pattern '^version' | Select-Object -First 1).Line.Split('"')[1]
          "VERSION=$v" >> $env:GITHUB_ENV
      - name: Install GStreamer
        shell: pwsh
        run: |
          choco install pkgconfiglite innosetup -y --no-progress
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          foreach ($f in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            Invoke-WebRequest "$base/$f" -OutFile $f
            Start-Process msiexec.exe -Wait -ArgumentList "/i $f /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
          }
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p slate
      - name: Bundle
        shell: pwsh
        run: ./packaging/windows/collect.ps1 -Out dist/slate-win
      - name: Zip + installer
        shell: pwsh
        run: |
          Copy-Item LICENSE dist/slate-win/
          Compress-Archive -Path dist/slate-win/* -DestinationPath "dist/slate-$env:VERSION-windows-x86_64-portable.zip"
          $env:SLATE_VERSION = $env:VERSION
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" packaging/windows/slate.iss
      - name: Smoke test portable build (clean PATH)
        shell: pwsh
        run: |
          # Hide the build machine's GStreamer so a DLL missing from the bundle fails here.
          $env:PATH = "$env:SystemRoot\system32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          Remove-Item Env:GSTREAMER_1_0_ROOT_MSVC_X86_64, Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          Rename-Item C:\gstreamer C:\gstreamer.hidden
          try {
            $p = Start-Process dist/slate-win/slate.exe -ArgumentList "--self-test","--network" -PassThru -Wait -NoNewWindow `
              -RedirectStandardOutput selftest.txt -RedirectStandardError selftest-err.txt
            Get-Content selftest.txt, selftest-err.txt
            # 0xC0000135 = STATUS_DLL_NOT_FOUND
            if ($p.ExitCode -ne 0) { throw "self-test failed with exit code $($p.ExitCode)" }
            # Diagnostics: each renderer on its own, logs captured.
            $env:SLATE_LOG = "debug,wgpu_hal=warn,naga=warn"
            foreach ($b in "winit-skia", "winit-femtovg", "winit-software") {
              $env:SLINT_BACKEND = $b
              $q = Start-Process dist/slate-win/slate.exe -PassThru -NoNewWindow -RedirectStandardOutput "gui-$b.txt" -RedirectStandardError "gui-$b-err.txt"
              Start-Sleep 8
              if ($q.HasExited) { "${b}: exited with $('{0:X}' -f $q.ExitCode)" } else { "${b}: running"; Stop-Process $q; Start-Sleep 1 }
              Get-Content "gui-$b.txt", "gui-$b-err.txt" -Tail 15
            }
            Remove-Item Env:SLINT_BACKEND
            # The real check: default renderer chain.
            $p = Start-Process dist/slate-win/slate.exe -PassThru -NoNewWindow -RedirectStandardOutput gui.txt -RedirectStandardError gui-err.txt
            Start-Sleep 10
            if ($p.HasExited) {
              Get-Content gui.txt, gui-err.txt -Tail 40
              throw "slate.exe exited early with code $('{0:X}' -f $p.ExitCode)"
            }
            Stop-Process $p
          } finally {
            Rename-Item C:\gstreamer.hidden C:\gstreamer
          }
      - name: Smoke test installer (install, run, uninstall)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          Start-Process $setup.FullName -Wait -ArgumentList "/VERYSILENT /SUPPRESSMSGBOXES /DIR=C:\SlateTest"
          if (-not (Test-Path C:\SlateTest\slate.exe)) { throw "install failed" }
          if (-not (Test-Path "HKLM:\Software\Classes\tidal\shell\open\command") -and -not (Test-Path "HKCU:\Software\Classes\tidal\shell\open\command")) { throw "tidal:// not registered" }
          Start-Process C:\SlateTest\unins000.exe -Wait -ArgumentList "/VERYSILENT"
          if (Test-Path C:\SlateTest\slate.exe) { throw "uninstall left files" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/*.zip
            dist/*-setup.exe

  bundle:
    needs: [appimage, windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: artifacts, merge-multiple: true }
      - name: Source tarball, checksums, notes
        run: |
          V="$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$V" ]]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo version $V"; exit 1
          fi
          git archive --format=tar.gz --prefix="slate-$V/" -o "artifacts/slate-$V-source.tar.gz" HEAD
          (cd artifacts && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          awk -v v="$V" '$0 ~ "^## \\[?"v"\\]?" {f=1; next} /^## / {f=0} f' CHANGELOG.md > notes.md
          cat >> notes.md <<'NOTES'

          **Windows:** the exe and installer are unsigned; SmartScreen may warn ("More info" → "Run anyway").
          **Linux:** `chmod +x` the AppImage and run it. Needs a working Vulkan or OpenGL driver; falls back to software rendering.
          Slate is not affiliated with TIDAL. Port of [lullabyX/sone](https://github.com/lullabyX/sone), GPL-3.0-only.
          NOTES
          test -s notes.md
          ls -l artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: |
            artifacts/*
            notes.md

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [bundle]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: release, path: release }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          # Published assets: the AppImage and the Windows installer only.
          gh release create "$GITHUB_REF_NAME" release/artifacts/*.AppImage release/artifacts/*-setup.exe \
            --repo "$GITHUB_REPOSITORY" \
            --title "Slate $GITHUB_REF_NAME" --notes-file release/notes.md
