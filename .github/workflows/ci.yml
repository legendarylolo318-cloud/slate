name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GST_VERSION: "1.24.13"

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config clang \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-good gstreamer1.0-plugins-bad \
            libasound2-dev libdbus-1-dev libssl-dev libfontconfig1-dev \
            libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev libvulkan-dev

      - name: Cache GStreamer installers (Windows)
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: C:\gst-msi
          key: gst-msi-${{ env.GST_VERSION }}

      - name: Install GStreamer (Windows MSVC)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install pkgconfiglite -y --no-progress
          $base = "https://gstreamer.freedesktop.org/data/pkg/windows/$env:GST_VERSION/msvc"
          New-Item -ItemType Directory -Force C:\gst-msi | Out-Null
          foreach ($name in "gstreamer-1.0-msvc-x86_64-$env:GST_VERSION.msi", "gstreamer-1.0-devel-msvc-x86_64-$env:GST_VERSION.msi") {
            $f = "C:\gst-msi\$name"
            # gstreamer.freedesktop.org can be slow and resets long downloads (the devel MSI is
            # 724 MB): resume where it stopped instead of starting over, and keep the MSIs cached.
            $want = [int64](curl.exe -sSIL "$base/$name" | Select-String -Pattern '^content-length:\s*(\d+)' | Select-Object -Last 1).Matches[0].Groups[1].Value
            for ($i = 1; $i -le 40; $i++) {
              if ((Test-Path $f) -and (Get-Item $f).Length -eq $want) { break }
              curl.exe -fL -sS --connect-timeout 30 -C - -o $f "$base/$name"
              if ($LASTEXITCODE -ne 0) { Write-Host "download interrupted ($i/40) at $((Get-Item $f -ErrorAction SilentlyContinue).Length) of $want bytes"; Start-Sleep -Seconds 5 }
            }
            if ((Get-Item $f).Length -ne $want) { throw "could not download $name" }
            Start-Process msiexec.exe -Wait -ArgumentList "/i $f /qn /norestart ADDLOCAL=ALL INSTALLDIR=C:\gstreamer"
          }
          $root = "C:\gstreamer\1.0\msvc_x86_64"
          "GSTREAMER_1_0_ROOT_MSVC_X86_64=$root" >> $env:GITHUB_ENV
          "PKG_CONFIG_PATH=$root\lib\pkgconfig" >> $env:GITHUB_ENV
          "$root\bin" >> $env:GITHUB_PATH

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
